# quad arm: "exp_sum" combine x "albedo" diffuse; ORIGINAL mlp2 input, r1.7,
# local loss 12k@0.002, priors->20k, d25k, zero-init
# = sum_exp arm with ORIGINAL mlp2 input (geo inputs attached, no detach) -
# control for the 2x2 on the r1.7/loss12k@0.001 base
# = detcos config with sum_exp combine
# = exp170 config + cos_nr DETACHED in light_mlp_2 input (informs MLP, no
# gradient into normals); roughness attached
# = spec_floor2_albedo_aff_r23_d25k.yaml but with the historical exp_sum light
# combine instead of sum_exp
# = spec_floor2_albedo_aff_r23.yaml with densify_until_iter 25k (was 15k)
# = spec_floor2_albedo_se_mono_aff.yaml with env radius 2.3
# = spec_floor2_albedo_se_mono.yaml WITH cam affine enabled
# + mono depth->5k / normal->9k, env radius 3.0
# + sum_exp light combine (local term starts ~0) + rotation LR drop OFF
# + local_light_mlp_zero_init: light_mlp_2 final weights zeroed (local pathway
# starts neutral in spec_light)
# spec: albedo diffuse + NO cam affine (else identical to spec_floor2_shdc.yaml)
# SH_DC TWIN of spec_floor2.yaml: ONLY change = inside_diffuse_source sh_dc (0-degree SH
# as inside-sphere diffuse instead of albedo).
# spec_floor2: selfcap floor2 dataset (60 frames @30fps, t 0.0-1.9667, 15 train cams,
# test cam 22139906, 1264x900) @ 30k iters.  Recipe = abuzabi111 champion (batch-2
# tail, reset 0.5, static sph16, abs-t-grad splits, affine, rotation-LR decay) with
# all schedules scaled x0.5 from the 60k base and the scene time model set for this
# clip.  Dataset lives in the 4dRefgs_sc project; data/spec_floor2 here is a
# symlink wrapper combining the packaged spec_floor2 dataset (images, pcds,
# transforms) with the parent dir's sgt_depth/sgt_normal priors, which the
# package lacks but training requires (depth prior loss until 40k has no
# None-guard).  Results save in this project (model_path).
# time_duration [0, 2.0] deliberately bounds pcd init: pcds_j10 has 100 plys but the
# scene spans only frames 0-59; the reference sc config's [0, 10] would init 40
# frames of points outside the clip.
gaussian_dim: 4
time_duration: [0.0, 2.0]
num_pts: 1000_000
num_pts_ratio: 1.0
rot_4d: True
force_sh_3d: True
batch_size: 1
exhaust_test: True

ModelParams:
  sh_degree: 0
  source_path: "/root/autodl-tmp/projects/4dRefgs_abuzabi/data/spec_floor2"
  model_path: "/root/autodl-tmp/projects/4dRefgs_abuzabi/output/spec_floor2"
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".jpg"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0
  env_optimize_until: 1000000000
  env_optimize_from: 0
  # selfcap floor scene: tight env sphere around the object area
  env_sphere_center: "0,1,3.5"
  env_sphere_radius: 1.6
  # SH-DC-as-diffuse twin: inside-sphere base color = 0-degree SH (view-
  # independent DC) instead of learned albedo; single-variable vs the base run
  inside_diffuse_source: "albedo"
  local_light_mlp_zero_init: True
  local_light_mlp_detach_cos: False
  spec_light_combine: "sum_exp"
  eval_shfs_4d: True
  temporal_opacity_mode: "flat_window"
  # local branch runs plain gaussian temporal opacity: effect-range penalties
  # off, no local temporal splits, spawn scaling_t matched per-gaussian to the
  # flat-window >0.05 ranges (local_temporal_init_frames -1 default)
  local_temporal_opacity_mode: "gaussian"
  temporal_flat_radius_mult: 1.0
  sph_residual_keyframes: 0
  sph_residual_from_iter: 10_000
  sph_hierarchy_bands: ""
  sph_parity_bands: ""
  sph_sliding_bands: ""
  sph_sliding_window: 8
  sph_time_min: 0.0
  sph_time_max: 1.9666666666666666
  fourier_c2f_start_iter: 30_000
  fourier_c2f_end_iter: -1

OptimizationParams:
  iterations: 30_000
  # batch-2 tail only (last 10%, same fraction as the 100f configs)
  batch_size_schedule: ""
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000032
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30_000
  brdf_mlp_lr_init : 0.016
  brdf_mlp_lr_final : 0.00016
  brdf_mlp_lr_delay_mult : 0.01
  brdf_mlp_lr_max_steps : 30_000
  feature_lr: 0.002
  opacity_lr: 0.05
  scaling_lr: 0.003
  rotation_lr: 0.001
  rotation_lr_final: -1.0   # rotation LR drop disabled (constant 0.001)
  rotation_lr_max_steps: 30_000
  velocity2_lr_init: 0.001
  velocity2_lr_final: 0.001
  velocity2_lr_delay_mult: 1.0
  velocity2_lr_max_steps: 30_000
  specular_lr : 0.00005
  albedo_lr : 0.001
  delta_normal_lr : 0.001
  roughness_lr : 0.0002
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.05
  densification_interval: 300
  opacity_reset_interval: 2500
  densify_from_iter: 500
  densify_until_iter: 25_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.002
  temporal_split_from_iter: 30_000
  temporal_split_until_iter: 30_000
  densify_specular_time_threshold: 0.00001
  opacity_zero_reset_iter: -1          # one-time reset disabled (was 0.5 mid-run)
  opacity_zero_reset_value: 0.5
  # --- scene time model: 60 frames @30fps, t in [0, 1.9667] ---
  pcd_init_frame_start: 0
  pcd_init_frame_end: 59
  temporal_fps: 30.0
  temporal_clip_t_min: 0.0
  temporal_clip_t_max: 1.9666666666666666
  temporal_cap_frames: 32.0      # num_frames/2 + 2, same margin as abuzabi 60f; static init needs 30f
  # --- phase starts scaled x0.5 from the 60k base ---
  lighting_start_iter: 4_000
  local_feature_start_iter: 7_000
  reset_opacity_high_until_iter: 12_500
  densify_interval_schedule: "9000:100,-1:200"   # 100 until 9k, then 200
  global_opacity_loss_until_iter: 25_000
  # local sparsity loss delayed to 15k (NOT the x0.5-scaled 7.5k): with loss from
  # 7.5k + 0.05 opacity pruning, the local branch died within 4k iters of its 6k
  # spawn (exp130: 725 local pts left at 10k, empty local feature map).  The
  # user's earlier spec_floor2 runs kept locals alive with loss from 15k of 30k;
  # spawn at 6k + loss at 15k gives a 9k loss-free runway.
  local_alpha_loss_weight: 0.0
  local_alpha_loss_from_iter: 7000
  local_alpha_loss_until_iter: 20000
  local_mlp_output_loss_weight: 0.01
  local_mlp_output_loss_from_iter: 10_000
  local_mlp_output_loss_until_iter: 20000
  local_opacity_loss_from_iter: 12_000
  local_opacity_loss_weight: 0.0
  local_feature_loss_weight: 0.0
  local_feature_loss_from_iter: 10_000
  local_reset_opacity_high_until_iter: -1
  density_entropy_loss_from_iter: 1_500
  # monocular priors cut early: depth to 5k, normal to 9k
  mono_depth_loss_until_iter: 5_000
  mono_normal_loss_until_iter: 30_000
  opacity_periodic_reset_interval: -1
  opacity_periodic_reset_value: 0.5
  opacity_periodic_reset_from_iter: 0
  opacity_periodic_reset_until_iter: 6000   # resets 0.5 @3k,6k
  temporal_opacity_k_start: 2.0
  temporal_opacity_k_final: 12.0
  temporal_opacity_k_ramp_start: 12_500
  temporal_opacity_k_ramp_end: 20_000
  temporal_opacity_k_loss_weight: 0.01
  temporal_flat_radius_start_mult: 0.0
  temporal_flat_radius_final_mult: 0.75
  temporal_flat_radius_ramp_start: 12_500
  temporal_flat_radius_ramp_end: 20_000
  temporal_flat_radius_loss_weight: 0.05
  train_num_workers: 4
  debug_interval: 100
  local_branch_lazy_init: True
  densify_until_num_points: -1
  final_prune_from_iter: -1
  sh_increase_interval: 40_000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  lambda_motion: 0.0
  cam_affine_enable: True
  cam_affine_lr: 0.001
  cam_affine_from_iter: 1000
  cam_affine_ssim_gate: 0.5
